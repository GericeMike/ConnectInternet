[package]
name = "rdlink-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
rdlink-proto = { path = "../proto" }
ffmpeg-the-third = "6"
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
