[package]
name = "rdlink-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
rdlink-proto = { path = "../proto" }
rdlink-transport = { path = "../transport" }
arboard = "3"
sha2 = "0.10"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
ffmpeg-the-third = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = "0.30"
wgpu = "30"
pollster = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "macros"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
